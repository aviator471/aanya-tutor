<!DOCTYPE html>
<!--
=====================================================================
  GRADE 5 TUTOR  —  single-file app (v1)
=====================================================================
  WHAT IT IS
    A lesson app for one family on one iPad. Mom makes a lesson from a
    topic, pasted text, or a worksheet (PDF or photo). The learner does a
    30–35 minute session with explanations, worked examples, adaptive
    practice, pencil-and-paper tasks, and a final check. Points add up
    toward goals Mom sets.

  HOW TO RUN IT
    1. Put this one file on any web host (for example GitHub Pages) and
       open the link in Safari on the iPad. Opening the file straight from
       the Files app also works for a quick test.
    2. In Safari, tap Share -> "Add to Home Screen", then always open it
       from that icon. Do this BEFORE you start. iPad Safari can erase a
       website's saved data after about 7 days without a visit; the
       Home Screen app is safe from that. (The Home Screen app keeps its
       own data, separate from the Safari tab.)
    3. Tap "Mom", create a 4-digit PIN, and paste your Claude API key.

  THE CLAUDE API KEY  (no key goes in this file)
    - Get a key at https://console.anthropic.com -> API Keys. Add a small
      amount of credit (a few dollars lasts a long time).
    - Paste it in the app: Mom -> Settings -> Claude key. It is saved
      only on this iPad, behind the Mom PIN. It is never in this file, so
      sharing the link does not share your key.
    - Tip: in the Anthropic console, set a monthly spend limit.

  WHAT IT COSTS
    Claude is only called when Mom makes a lesson (about 5–10 cents) and
    when the learner taps "Explain it differently" (max 3 per lesson, a
    fraction of a cent each). Practice, checking, feedback and pencil
    tasks never call Claude.

  WHERE DATA LIVES
    Everything (lessons, progress, points, goals) is saved in this
    browser on this iPad. Someone else opening the link sees an empty
    app. Use Mom -> Settings -> "Save a backup" now and then; "Restore"
    brings it back on any device.

  CHANGING MODELS
    See CONFIG just below the <script> tag. One line each.
=====================================================================
-->

<script>
'use strict';
/* ==================================================================
   CONFIG  (the only part you might want to change)
   ================================================================== */
const CONFIG = {
  // Model that writes lessons. Accuracy matters here (answer keys).
  // Cheaper option: 'claude-haiku-5-5' (about 1/20th the cost, more answer-key mistakes).
  AUTHOR_MODEL: 'claude-sonnet-5-5',
  AUTHOR_EFFORT: 'low',          // 'low' is fast. 'medium' thinks more (slower, a bit more accurate).
  // Model for the "Explain it differently" button.
  EXPLAIN_MODEL: 'claude-haiku-5-5',

}

/* ==================================================================
   Claude API (browser-direct). Only used for authoring + "explain differently".
   ================================================================== */
const cleanKey = k => String(k || '').replace(/[^\x21-\x7E]/g, '');
async function callClaude({ model, system, content, maxTokens = 20000, effort, onProgress, signal }) {
  const key = cleanKey(S.settings.apiKey);
  if (!key) throw new Error('NO_KEY');
  const body = { model, max_tokens: maxTokens, stream: true, system, messages: [{ role: 'user', content }] };
  if (effort) body.output_config = { effort };
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify(body),
    });
  } catch (e) { if (signal && signal.aborted) throw Object.assign(new Error('aborted'), { name: 'AbortError' }); const err = new Error('NETWORK'); err.detail = (e.name || 'Error') + ': ' + (e.message || ''); throw err; }
  if (signal && signal.aborted) throw Object.assign(new Error('aborted'), { name: 'AbortError' });
  if (!res.ok) {
    let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch (_) {}
    const err = new Error('HTTP_' + res.status); err.detail = msg; err.status = res.status; throw err;
  }
  const reader = res.body && res.body.getReader ? res.body.getReader() : null, dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  for (;;) {
    if (!reader) { try { buf = await res.text(); } catch (e) { const err = new Error('NETWORK'); err.detail = 'Reply could not be read (' + (e.message || e.name) + ')'; throw err; } buf += '\n'; }
    else {
    let chunk;
    try { chunk = await reader.read(); } catch (e) { const err = new Error('NETWORK'); err.detail = 'Connection dropped while writing (' + (e.message || e.name) + ')'; throw err; }
    const { value, done } = chunk;
    if (done) break;
    buf += dec.decode(value, { stream: true });
    }
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch (_) { continue; }
      if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onProgress && onProgress(text.length); }
      else if (ev.type === 'message_delta' && ev.delta) stop = ev.delta.stop_reason || stop;
      else if (ev.type === 'error') { const err = new Error('STREAM'); err.detail = ev.error?.message; throw err; }
    }
    if (!reader) break;
  }
  if (stop === 'refusal') throw new Error('REFUSAL');
  if (stop === 'max_tokens') { const err = new Error('TRUNCATED'); throw err; }
  return text;
}
function friendlyError(e) {
  const m = e.message || '';
  if (m === 'NO_KEY') return 'Add your Claude key in Settings first.';
  if (m === 'NETWORK') return 'Couldn’t reach Claude. Check the Wi-Fi and try again.' + (e.detail ? ' (Technical detail: ' + e.detail + ')' : '');
  if (m === 'REFUSAL') return 'Claude couldn’t make a lesson from that. Try wording the topic differently.';
  if (m === 'TRUNCATED') return 'That lesson was too long and got cut off. Try a smaller topic, or turn off “Split big topics”.';
  if (m === 'BAD_LESSON') return 'The lesson came back incomplete. Please try again.';
  if (e.status === 401 || e.status === 403) return 'Your Claude key didn’t work. Check it in Settings.';
  if (e.status === 429 || e.status === 529 || e.status >= 500) return 'Claude is busy right now. Try again in a minute.';
  if (e.status === 400 && /credit|billing|balance/i.test(e.detail || '')) return 'Your Claude account is out of credit. Add some at console.anthropic.com.';
  if (e.status === 400 || e.status === 413) return 'Claude couldn’t read that. If it’s a big file, try pasting the text or typing the topic. (' + (e.detail || 'error') + ')';
  return 'Something went wrong (' + (e.detail || m) + '). Try again.';
}

/* ---------- Lesson authoring prompt ---------- */
const AUTHOR_SYSTEM = `You write lessons for a learning app used by ONE Grade 5 student (age 10) in Ontario, Canada, on an iPad. A parent gives you a topic title, pasted text, or a worksheet. You return ONE JSON object and nothing else: no markdown fences, no comments.

CURRICULUM
Align to the current Ontario curriculum for Grade 5:
- math: Mathematics (2020). Strands: A Social-Emotional Learning Skills & Math Processes, B Number, C Algebra (incl. coding), D Data (incl. probability), E Spatial Sense, F Financial Literacy.
- science: Science and Technology (2022). Strands: A STEM Skills & Connections, B Life Systems, C Matter and Energy, D Structures and Mechanisms, E Earth and Space Systems.
- literacy: Language (2023). Strands: A Literacy Connections & Applications, B Foundations of Language, C Comprehension, D Composition.
- social: Social Studies Grades 1–6 (2023). Grade 5 strands: A Heritage & Identity (interactions of Indigenous peoples and Europeans before 1713), B People & Environments (role of government and responsible citizenship).
If you only get a title, infer what a Grade 5 Ontario class learns under it and use the standard examples teachers use. If given a worksheet, teach the same skills and include problems like the ones on it.
Canadian context: dollars and cents, metric units, Canadian spelling, Canadian places and names.
Content is neutral and secular: no religious framing or faith-based examples.

VOICE (very important)
Sound like a great Grade 5 teacher talking to a curious kid. Not like a parent, not like a textbook.
- Short sentences. One idea per card.
- Concrete everyday example FIRST (snacks, pizza, games, allowance money, sports, pets), then the idea.
- Show a new word in action before you name it.
- Visual language ("Picture 3 pizzas, each cut into 4 slices").
- Each explain card: max 60 words.
- Kind, never shaming. Wrong-answer explanations are one friendly line that shows the right thinking.

SESSION (30–35 minutes total, the app runs it in this order)
explain cards (1–3, ~1 min each) → worked examples (2–3, ~2 min each) → pencil task 1 → adaptive practice → pencil task 2 → more practice → pencil task 3 → check.
"offscreen" pencil tasks: 2–3 tasks, 4–6 minutes each ("minutes"), 3–5 problems each, with an answer for every problem. Done on paper away from the screen. Make them meaty enough to fill the time (e.g. show your work, draw a model, write a sentence).

QUESTIONS
practice: 12–15 questions. "tier" 1 = easy warm-up, 2 = on grade level, 3 = stretch. About 5 / 5 / 4. Mix types.
check: 6–8 questions, ONLY "mcq" or "numeric", covering every concept, mostly tier 2. Don't repeat practice questions.
Types:
- "mcq": "choices" = 3–4 strings; "answer" must be EXACTLY one of the choices (same text). Wrong choices should reflect common mistakes.
- "numeric": "answer" is a whole number, decimal, fraction like "3/4", or mixed number like "2 1/3". No units in the answer; put units in the prompt ("How many cm?"). Fractions in lowest terms unless the question asks for another form. ALWAYS include "expr": a plain arithmetic expression using only numbers, + - * / and parentheses that computes the answer (e.g. "(3/4)*8", "125-48", "2+1/3"). The app recomputes it to check your answer key.
- "short": a one- or two-word answer; list other correct forms in "accept". Use rarely.
- "order": put 3–5 things in order (timeline, steps, smallest to largest). "answer" is the array of items in the correct order.
Every question has "explanationWrong" (one kind line explaining why the right answer is right) and "explainRef" (0-based index of the explain card it relates to). Optional "visual": a short emoji picture (max 40 characters) when it helps.
The answer must never appear in the prompt. Prompts: max ~30 words.
Work every answer out carefully before writing it. A wrong answer key marks a child wrong when she is right, so accuracy matters more than anything else.

TAGGING
The request lists the Grade 5 expectation codes for the subject. Put the 1–3 codes the lesson teaches in meta.expectations, and give every practice and check question an "exp" code. Use ONLY codes from that list. If a target expectation is given, teach to it.

SUBJECT NOTES
- math: use "numeric" with "expr" wherever possible.
- science: concept quizzes, "which part does…" labelling questions (describe parts in words or emoji), cause → effect, fair-test thinking. Pencil tasks may be safe at-home observations or mini-experiments with kitchen items (no heat, sharp tools, or chemicals; say "ask a grown-up" when needed); give expected observations as the answers.
- literacy: for reading comprehension, write an ORIGINAL "passage" (250–400 words, Grade 5 reading level, story or information text, Canadian setting welcome) and base the questions on it. For grammar, spelling or vocabulary, use mcq/short with clear single answers. Pencil tasks can be short writing tasks; give a checklist of what a good answer includes as the "answers".
- social: timelines with "order", cause → effect and perspective questions as mcq. Name specific First Nations, Métis and Inuit peoples, present them accurately and respectfully as living, diverse peoples, avoid stereotypes. Pencil tasks can be maps, timelines or short "from their point of view" writing.

JSON SHAPE
{
  "sequence": null OR { "title": string, "lessons": [ { "title": string, "focus": string } ] },
  "sourceNotes": string,
  "lesson": {
    "meta": { "subject": "math|science|social|literacy", "strand": string, "topic": string, "title": string (short, kid-friendly), "curriculum": string, "expectations": [codes from the list, e.g. "B2.5"], "forMom": string (one sentence: what she'll practice) },
    "concepts": [3–5 short bullets for the parent],
    "passage": null OR { "title": string, "text": string }  (literacy reading lessons; otherwise null),
    "explain": [ { "text": string, "visual": string (optional emoji picture), "term": string (optional) } ],
    "examples": [ { "title": string, "problem": string, "visual": string (optional), "steps": [string], "answer": string } ],
    "practice": [ { "type": "mcq|numeric|short|order", "tier": 1|2|3, "prompt": string, "choices": [string], "answer": string or [string], "accept": [string], "expr": string, "explanationWrong": string, "explainRef": number, "exp": string (code), "visual": string } ],
    "offscreen": [ { "title": string, "instructions": string, "problems": [string], "answers": [string], "minutes": number } ],
    "check": [ same shape as practice, type mcq or numeric only ],
    "reward": { "pointsBase": 100 }
  }
}
"sourceNotes": up to 250 words summarizing the source material (key facts, numbers, wording) so later lessons in a sequence can be written without it. Empty string if the input was just a title.`;

function authorUserContent(req) {
  const target = req.expCode || (req.seq && req.seq.expCode);
  const subj = `Subject: ${req.subject} (${SUBJECTS[req.subject].curriculum}). Grade 5.\n${expListText(req.subject)}${target ? `\nTarget expectation for this lesson: ${target} (${expText(req.subject, target)}).` : ''}`;
  if (req.mode === 'sequence') {
    const { seq, k } = req;
    return [{ type: 'text', text: `${subj}
This is lesson ${k + 1} of ${seq.lessons.length} in the sequence "${seq.title}".
Sequence plan:
${seq.lessons.map((e, i) => `${i + 1}. ${e.title}: ${e.focus}`).join('\n')}
Build ONLY lesson ${k + 1} ("${seq.lessons[k].title}", focus: ${seq.lessons[k].focus}). Build on the earlier lessons; don't re-teach them except as a quick reminder.
Notes about the source material: ${seq.notes || '(only a topic title was given)'}
Set "sequence" to null.` }];
  }
  const splitRule = req.split
    ? 'If this is too much for one 30–35 minute Grade 5 lesson, plan a sequence of 2–3 lessons in teaching order, return it in "sequence", and build ONLY lesson 1 in full in "lesson". Otherwise set "sequence" to null.'
    : 'Make exactly ONE lesson that covers the whole thing. Set "sequence" to null.';
  if (req.mode === 'topic') return [{ type: 'text', text: `${subj}\nTopic: ${req.topic}\n${splitRule}` }];
  if (req.mode === 'text') return [{ type: 'text', text: `${subj}\nHere is the worksheet or notes text:\n<source>\n${req.text}\n</source>\n${splitRule}` }];
  const block = req.file.kind === 'pdf'
    ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: req.file.data } }
    : { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: req.file.data } };
  return [block, { type: 'text', text: `${subj}\nBuild the lesson from the attached worksheet (it may be a scan or photo).\n${splitRule}` }];
}
function extractJSON(t) {
  t = t.replace(/^```(?:json)?/m, '').replace(/```\s*$/m, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('BAD_LESSON');
  return JSON.parse(t.slice(a, b + 1));
}
async function authorLesson(req, onProgress, signal) {
  let lastErr;
  for (let tries = 0; tries < 2; tries++) {
    const text = await callClaude({ model: CONFIG.AUTHOR_MODEL, effort: CONFIG.AUTHOR_EFFORT, system: AUTHOR_SYSTEM, content: authorUserContent(req), onProgress, signal });
    try {
      const out = extractJSON(text);
      const lesson = normalizeLesson(out.lesson || out, req.subject);
      const target = req.expCode || (req.seq && req.seq.expCode);
      if (target && !lesson.meta.expectations.includes(target)) lesson.meta.expectations.unshift(target);
      [...lesson.practice, ...lesson.check].forEach(q => { if (!q.exp) q.exp = lesson.meta.expectations[0] || ''; });
      return { lesson, sequence: out.sequence, sourceNotes: str(out.sourceNotes) };
    } catch (e) { lastErr = e; if (e.name === 'AbortError') throw e; }
  }
  throw new Error('BAD_LESSON');
}

/* ---------- Answer-key safety: parse numbers + recompute expressions (no eval) ---------- */
function parseNumber(input) {
  if (input == null) return null;
  let s = String(input).trim().toLowerCase().replace(/[$¢%]/g, '').replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/\s+/g, ' ').trim();
  s = s.replace(/\s*[a-z²³]+\.?$/, '').trim();
  let m;
  if ((m = s.match(/^(-?\d+) (\d+)\/(\d+)$/))) { const w = +m[1], n = +m[2], d = +m[3]; if (!d) return null; return { v: w < 0 ? w - n / d : w + n / d, frac: { n: Math.abs(w) * d + n, d, fp: { n, d } }, kind: 'mixed' }; }
  if ((m = s.match(/^(-?\d+)\/(\d+)$/))) { const n = +m[1], d = +m[2]; if (!d) return null; return { v: n / d, frac: { n, d, fp: { n, d } }, kind: 'frac' }; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return { v: parseFloat(s), kind: 'dec' };
  return null;
}
function evalExpr(src) {
  const s = String(src || '').replace(/×/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/\s+/g, '');
  if (!s || /[^0-9+\-*/().]/.test(s)) return null;
  let i = 0;
  const num = () => { const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const factor = () => { if (s[i] === '-') { i++; return -factor(); } if (s[i] === '+') { i++; return factor(); } if (s[i] === '(') { i++; const v = expr(); if (s[i++] !== ')') throw 0; return v; } return num(); };
  const term = () => { let v = factor(); while (s[i] === '*' || s[i] === '/') { const op = s[i++], r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const op = s[i++], r = term(); v = op === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); return i === s.length && isFinite(v) ? v : null; } catch (_) { return null; }
}
function normQ(q, id, dropped, checkOnly) {
  if (!q || typeof q !== 'object') return null;

  try {
    for (const seq of Object.values(S.sequences)) {
      for (let k = 1; k < seq.lessons.length; k++) {
        const e = seq.lessons[k];
        if (e.lessonId || e.status === 'deleted') continue;
        e.status = 'writing'; refreshMom();
        try {
          const out = await authorLesson({ subject: seq.subject, mode: 'sequence', seq, k });
          if (!S.sequences[seq.id]) break;
          const L = out.lesson;
          L.id = uid(); L.createdAt = Date.now(); L.source = 'sequence'; L.status = 'ready'; L.explainUsed = 0;
          Object.assign(L.meta, { sequenceId: seq.id, sequencePosition: k + 1, sequenceTotal: seq.lessons.length });

  const rec = a.sub.fb ? a.answers[a.answers.length - 1] : null;

/* ---------- spaced review: a missed question comes back today, then after 1, 3 and 7 days; 4 right in a row retires it ---------- */
/* ---------- "My mistakes" notebook: every missed question, across lessons, until she beats it ---------- */
const CAUSES = { slip: ['😅', 'Silly slip'], fact: ['🧠', 'Forgot a fact'], idea: ['💡', 'Didn’t get the idea'] };
const nbFor = (lessonId, qid) => S.notebook.find(n => n.lessonId === lessonId && n.q.id === qid);
function nbMiss(lessonId, q) {
  const subject = (S.lessons[lessonId] && S.lessons[lessonId].meta.subject) || 'math';
  let n = nbFor(lessonId, q.id);
  if (n) { n.misses++; n.status = 'open'; n.last = Date.now(); n.good = 0; }
  else { S.notebook.push({ id: uid(), lessonId, subject, q: JSON.parse(JSON.stringify(q)), cause: '', misses: 1, good: 0, status: 'open', first: Date.now(), last: Date.now() }); }
  if (S.notebook.length > 150) { const i = S.notebook.findIndex(x => x.status === 'conquered'); S.notebook.splice(i >= 0 ? i : 0, 1); }
}
function nbUnmiss(lessonId, qid) { const n = nbFor(lessonId, qid); if (!n) return; if (n.misses <= 1) S.notebook = S.notebook.filter(x => x !== n); else n.misses--; }
function addToReview(lessonId, q) {
  if (!lessonId) return;
  nbMiss(lessonId, q);
  const ex = S.review.find(r => r.lessonId === lessonId && r.q.id === q.id);
  if (ex) { ex.box = 1; ex.due = todayStr(); return; }
  S.review.push({ id: uid(), lessonId, q: JSON.parse(JSON.stringify(q)), box: 1, due: todayStr(), cause: '' });
  if (S.review.length > 80) S.review.shift();
}
/* Silly slips are retired after 2 right answers; forgotten facts and misunderstood ideas need 4 (spread over days). */
function reviewUpdate(r, correct) {
  const n = nbFor(r.lessonId, r.q.id);
  if (correct) {
    r.box++;
    if (n) n.good = (n.good || 0) + 1;
    if (r.box > (r.cause === 'slip' ? 2 : 4)) { S.review = S.review.filter(x => x !== r); if (n) { n.status = 'conquered'; n.done = Date.now(); } return; }
    r.due = addDays(todayStr(), [0, 0, 1, 3, 7][r.box]);

}
A.setCause = v => {

  const lessonId = st.k === 'warm' ? (S.review.find(r => r.id === st.id) || {}).lessonId || a.lessonId : a.lessonId;
  a.sub.fb.cause = v; if (rec) rec.cause = v;
  const n = nbFor(lessonId, q.id); if (n) n.cause = v;

let EXPLAINING = false;
A.explainDiff = async i => {

      content: [{ type: 'text', text: `Lesson: ${L.meta.title} (${SUBJECTS[L.meta.subject]?.label}, Grade 5)\nThe explanation she didn't get:\n${card.text}\n${prev.length ? 'Other ways already tried:\n' + prev.join('\n') : ''}` }],
    });

function addPoints(n, why) { if (!n) return; S.points.balance += n; S.points.earned += Math.max(0, n); S.points.log.push({ t: Date.now(), n, why }); if (S.points.log.length > 400) S.points.log.splice(0, 100); }

    causes: scored.reduce((m, x) => { if (!x.correct && x.cause) m[x.cause] = (m[x.cause] || 0) + 1; return m; }, {}),

<div class="card">${S.goals.length ? `<ul class="list">${S.goals.map(g => `<li class="item"><div class="grow"><div class="t">${esc(g.name)} ${g.done ? '✓' : ''}</div><div class="s">${money(g.price)} = ${Math.round(g.price * rate)} points</div></div>
  ${g.done ? '<span class="chip g">Got it</span>' : `<button class="sm" data-a="goalBought" data-v="${g.id}">Bought it</button>`}<button class="sm" data-a="goalDel" data-v="${g.id}">✕</button></li>`).join('')}</ul>` : '<p class="muted">No goals yet. Add a toy or treat she wants.</p>'}
  <div class="row" style="margin-top:10px"><input data-bind="RW:goal" placeholder="e.g. LEGO set" value="${esc(FORMS.RW.goal)}"><input data-bind="RW:price" type="number" inputmode="decimal" placeholder="Price $" style="max-width:130px" value="${esc(FORMS.RW.price)}"><button class="ghost" style="flex:0" data-a="goalAdd">Add</button></div>
  <p class="muted"><small>The first goal not yet bought shows on her home screen. “Bought it” takes those points off her balance.</small></p></div>
<h3>Other things points can buy</h3>
<div class="card">${S.redeemables.length ? `<ul class="list">${S.redeemables.map(r => `<li class="item"><div class="grow t">${esc(r.name)}</div><span class="chip">${r.points} pts</span><button class="sm" data-a="redeem" data-v="${r.id}">Redeem</button><button class="sm" data-a="redeemDel" data-v="${r.id}">✕</button></li>`).join('')}</ul>` : '<p class="muted">e.g. “30 min screen time”, “Pick dinner”.</p>'}
  <div class="row" style="margin-top:10px"><input data-bind="RW:rname" placeholder="Reward" value="${esc(FORMS.RW.rname)}"><input data-bind="RW:rpts" type="number" inputmode="numeric" placeholder="Points" style="max-width:120px" value="${esc(FORMS.RW.rpts)}"><button class="ghost" style="flex:0" data-a="redeemAdd">Add</button></div></div>
<h3>How points are earned</h3>
<div class="card kv"><span>Finish a lesson</span><b>${CONFIG.POINTS.lessonBase}</b><span>Each correct answer</span><b>${CONFIG.POINTS.perCorrect}</b><span>${CONFIG.POINTS.streakEvery}-day streak</span><b>${CONFIG.POINTS.streakBonus}</b><span>Perfect check</span><b>${CONFIG.POINTS.perfectCheck}</b></div>`;
};
A.saveRate = () => { const v = Math.round(+$('#rateIn').value); if (v >= 1) { S.settings.rate = v; save(); toast('Saved.'); render(); } };
A.goalAdd = () => { const n = str(FORMS.RW.goal), p = +FORMS.RW.price; if (!n || !(p > 0)) { toast('Add a name and a price.'); return; } S.goals.push({ id: uid(), name: n, price: Math.round(p * 100) / 100, done: false }); FORMS.RW.goal = ''; FORMS.RW.price = ''; save(); render(); };
A.goalDel = id => { S.goals = S.goals.filter(g => g.id !== id); save(); render(); };
A.goalBought = id => {
  const g = S.goals.find(x => x.id === id), cost = Math.round(g.price * (S.settings.rate || 100));
  if (S.points.balance < cost && !confirm(`She has ${S.points.balance} of ${cost} points. Mark it bought anyway? Her balance will go to 0.`)) return;
  if (S.points.balance >= cost && !confirm(`Take ${cost} points for “${g.name}”?`)) return;
  addPoints(-Math.min(cost, S.points.balance), 'Bought: ' + g.name); g.done = true; save(); render();
};
A.redeemAdd = () => { const n = str(FORMS.RW.rname), p = Math.round(+FORMS.RW.rpts); if (!n || !(p > 0)) { toast('Add a reward and points.'); return; } S.redeemables.push({ id: uid(), name: n, points: p }); FORMS.RW.rname = ''; FORMS.RW.rpts = ''; save(); render(); };
A.redeemDel = id => { S.redeemables = S.redeemables.filter(r => r.id !== id); save(); render(); };
A.redeem = id => {
  const r = S.redeemables.find(x => x.id === id);
  if (S.points.balance < r.points) { toast(`She needs ${r.points - S.points.balance} more points.`); return; }
  if (!confirm(`Take ${r.points} points for “${r.name}”?`)) return;
  addPoints(-r.points, 'Redeemed: ' + r.name); save(); toast('Redeemed 🎉'); render();
};

VIEWS.settings = () => {
  FORMS.ST = { key: '', name: S.settings.learnerName };
  const k = S.settings.apiKey;
  return `
<div class="topbar"><button data-a="go" data-v="momHome">← Home</button><span class="who">Settings</span><span></span></div>
<div class="card"><h2>Claude key</h2>
<p class="muted">${k ? `Saved on this iPad (ends in …${esc(k.slice(-4))}).` : 'Not added yet. Get one at console.anthropic.com → API Keys.'}</p>
<input data-bind="ST:key" type="password" placeholder="${k ? 'Paste a new key to replace it' : 'sk-ant-...'}" autocomplete="off">
<div class="row" style="margin-top:10px"><button class="ghost" data-a="saveKey">Save key</button>${k ? `<button class="ghost" data-a="testKey">Test it</button>` : ''}</div>
<p class="muted"><small>Lessons use ${esc(CONFIG.AUTHOR_MODEL)}. “Explain it differently” uses ${esc(CONFIG.EXPLAIN_MODEL)}.</small></p></div>
<div class="card"><h2>Learner</h2><label>First name</label><div class="row"><input data-bind="ST:name" value="${esc(S.settings.learnerName)}"><button class="ghost" style="flex:0" data-a="saveName">Save</button></div></div>
<div class="card"><h2>Backup</h2><p class="muted">Saves lessons, progress, points and goals to a file (not the key or PIN). ${S.settings.lastExport ? 'Last backup: ' + fmtDate(S.settings.lastExport) + '.' : ''}</p>
<div class="row"><button class="ghost" data-a="exportData">💾 Save a backup</button><label class="ghost" style="margin:0;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center">📂 Restore<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label></div></div>
<div class="card"><h2>PIN</h2><button class="ghost" data-a="changePin">Change Mom PIN</button></div>
${!isStandalone() ? `<div class="card"><h2>Keep progress safe</h2><p>On the iPad, tap Share → <b>Add to Home Screen</b> and open the app from that icon. Safari can erase website data after about a week without a visit; the Home Screen app is protected. The icon starts empty, so save a backup here first and restore it there.</p></div>` : ''}
<div class="card"><h2>Start over</h2><button class="ghost danger" data-a="eraseAll">Erase everything on this iPad</button></div>`;
};
A.saveKey = () => { const k = cleanKey(FORMS.ST.key); if (!k) { toast('Paste the key first.'); return; } if (!/^sk-ant-/.test(k) && !confirm('That doesn’t look like a Claude key (they start with sk-ant-). Save anyway?')) return; S.settings.apiKey = k; save(); toast('Key saved.'); render(); pumpSequences(); };
A.testKey = async (_, el) => {
  el.disabled = true; el.textContent = 'Testing…';
  try { await callClaude({ model: CONFIG.EXPLAIN_MODEL, maxTokens: 50, effort: 'low', system: 'Reply with the single word OK.', content: [{ type: 'text', text: 'Test' }] }); toast('The key works ✓'); }
  catch (e) { alert(friendlyError(e)); }
  el.disabled = false; el.textContent = 'Test it';
};
A.saveName = () => { S.settings.learnerName = str(FORMS.ST.name); save(); toast('Saved.'); };
A.changePin = () => { pinBuf = ''; go('pin', { mode: 'set1', change: true }); };
A.eraseAll = () => {
  if (prompt('This deletes all lessons, progress and points on this iPad. Type ERASE to confirm.') !== 'ERASE') return;
  localStorage.removeItem(CONFIG.STORAGE_KEY); load(); role = null; GEN = null; go('gate');
};
A.exportData = () => {
  const data = Object.assign({}, S, { settings: Object.assign({}, S.settings, { apiKey: '', pin: null }), attempt: null, app: 'g5-tutor', exportedAt: new Date().toISOString() });
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `tutor-backup-${todayStr()}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  S.settings.lastExport = Date.now(); save(); toast('Backup saved to your Files / Downloads.'); if (view.name === 'momHome' || view.name === 'settings') render();
};
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.lessons || !d.settings || !d.points) throw new Error('bad');
      if (!confirm('Replace everything on this iPad with this backup?')) return;
      const keep = { apiKey: S.settings.apiKey, pin: S.settings.pin };
      delete d.app; delete d.exportedAt;
      S = Object.assign(DEFAULT_STATE(), d);
      S.settings = Object.assign(DEFAULT_STATE().settings, d.settings, { apiKey: keep.apiKey || '', pin: keep.pin || d.settings.pin || null, welcomed: true });
      S.points = Object.assign(DEFAULT_STATE().points, d.points); S.streak = Object.assign(DEFAULT_STATE().streak, d.streak || {});
      save(); toast('Restored ✓'); go('momHome');
    } catch (e) { toast('That file isn’t a backup from this app.'); }
  };
  r.readAsText(file);
}

/* ==================================================================
   Boot
   ================================================================== */
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 180, 180); gr.addColorStop(0, '#5B4BDB'); gr.addColorStop(1, '#FF8A3D');
    g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
    g.font = '110px -apple-system, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('⭐', 90, 98);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (_) {}
}
load();
if (S.settings.apiKey) { const ck = cleanKey(S.settings.apiKey); if (ck !== S.settings.apiKey) { S.settings.apiKey = ck; save(); } }
makeIcon();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
document.addEventListener('visibilitychange', () => { if (S.attempt) { if (document.hidden) { touch(); save(); } else S.attempt.tick = Date.now(); } });
render();
setTimeout(pumpSequences, 4000);
</script>
</body>
</html>
